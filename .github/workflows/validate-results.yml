name: Fixture reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixture-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m pytest -m smoke
      - run: python -m recommender.smoke --seeds 42 43 44 --output artifacts/fixture-three-seeds.json
      - name: Record code and environment
        shell: bash
        run: |
          git rev-parse HEAD > artifacts/commit.txt
          python --version > artifacts/python.txt
          python -m pip freeze > artifacts/environment.txt
          echo 'Synthetic fixture only. These are not P0 research results.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-fixture-three-seeds
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

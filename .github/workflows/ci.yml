name: CI

on:
  push:
    branches: [bao-long, ba-chien, trung-chien, dev, main]
  pull_request:
    branches: [bao-long, dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python src/recommender/branch_policy.py

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: node --test .github/tests/trusted-policy.test.cjs

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest -m 'not smoke' --junitxml=artifacts/unit-tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: unit-test-report
          path: artifacts/unit-tests.xml
          retention-days: 7

  pipeline-smoke:
    name: pipeline-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest -m smoke
      - run: python -m recommender.smoke --output artifacts/smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-smoke-report
          path: artifacts/smoke.json
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-audit.txt'
      - run: mkdir -p artifacts
      - name: Audit locked development and audit-tool dependencies
        run: >-
          python -m pip_audit --disable-pip --no-deps --require-hashes --strict
          -r requirements-audit.txt --format json --output artifacts/dependency-audit.json
      - name: Export CycloneDX inventory
        if: ${{ always() }}
        run: >-
          python -m pip_audit --disable-pip --no-deps --require-hashes --strict
          -r requirements-audit.txt --format cyclonedx-json --output artifacts/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: dependency-security-report
          path: artifacts/
          retention-days: 14

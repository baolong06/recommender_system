[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender-system-p0"
version = "0.1.0"
description = "Shared evaluation foundations for the three P0 recommendation projects"
requires-python = ">=3.12"
dependencies = ["pandas==2.3.3", "pyarrow==26.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["smoke: integration checks on synthetic data only"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
